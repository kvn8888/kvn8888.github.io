<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Jobs Utility Diagnostics</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <main>
      <h1>Jobs Utility Diagnostics</h1>
      <p>
        Only runtime version, compatibility and activity counts are shown. No
        keys or captured answers.
      </p>
      <p>
        Before updating, pause collection on all enabled sites, finish active
        captures and wait for pending writes. Review drafts stay saved.
      </p>
      <p id="compatibility-status" role="status"></p>
      <button class="button" id="check">Check compatibility now</button>
      <button class="button" id="refresh">Refresh report</button>
      <button class="button" id="download">Download diagnostics</button>
      <pre style="white-space: pre-wrap; overflow-wrap: anywhere"></pre>
    </main>
    <script type="module" src="diagnostics.js"></script>
  </body>
</html>
