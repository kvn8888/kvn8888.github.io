# render.yaml — Render Blueprint for the speech-tools service
# Deploy from: GitHub repo root context = speech-tools/
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: speech-tools
    runtime: docker
    # Point Render to the Dockerfile in this subdirectory
    dockerfilePath: ./speech-tools/Dockerfile
    dockerContext: ./speech-tools
    plan: starter          # Upgrade to "standard" for always-on (no cold starts)
    healthCheckPath: /health
    envVars:
      # Set these in the Render dashboard (or via Render API) — do NOT commit values
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_API_VERSION
        value: "2025-03-01-preview"
      - key: AZURE_OPENAI_DIARIZE_DEPLOYMENT
        value: "gpt-4o-transcribe-diarize"
